function tiers(){return `<div class="tiergrid">${[['1–3 户',500],['4–29 户',600],['30 户及以上',700]].map(([n,p])=>`<div class="tier"><small>${n}</small><strong>${p}</strong><small>HK$ / 有效户</small></div>`).join('')}</div><p class="subtle">达到新档位后，当月全部有效户按新单价计算。0 户奖励为 0。</p>`}
function openingForecast(n){return n*(n>=30?700:n>=4?600:n>=1?500:0)}
function overviewPage(){let s=overview.stats,admin=me.role==='admin',forecast=admin?overview.partners.reduce((sum,p)=>sum+openingForecast(p.total),0):openingForecast(s.total);$('#view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">自助客户查询系统</div><h1>${admin?'渠道数据总览':'个人中心'}</h1><div class="desc">${admin?'各伙伴独立统计，客户进度与奖励一目了然':'客户进度与奖励一目了然，仅展示您名下的记录'}</div></div><label>统计月份 <input id="month" type="month" class="field" value="${month}"></label></div><div class="cards">${[['当月开户客户',s.total,'▤','按开户月份统计'],['已确认有效户',s.verified,'✓','管理员已审核确认'],['待审核客户',s.pending,'◷','等待有效资格核对'],[admin?'开户奖励预估合计':'我的开户奖励预估',hk(forecast),'＄','假设全部达标 · 非可结算金额']].map(([a,b,i,d],n)=>`<div class="stat stat-${n}"><div class="metric-icon" aria-hidden="true">${i}</div><div><div class="statlabel">${a}</div><div class="statval">${b}</div><div class="statfoot">${d}</div></div></div>`).join('')}</div><div class="panel query-panel"><div class="panel-heading"><div><h2>客户自助查询</h2><p>按手机尾号或致富客户编号，查询已获授权的记录</p></div><span class="scope-tag">仅查询授权范围</span></div><form class="lookup" id="searchform"><select id="query-type" class="field" aria-label="查询方式"><option value="tail">手机尾号</option><option value="code">致富客户编号</option></select><input aria-label="查询内容" id="query" maxlength="64" placeholder="输入四位尾号或客户编号" required><button class="btn primary">立即查询</button></form><div class="note">尾号仅用于筛选您有权查看的记录，不是完整手机号核验。同尾号可能对应多人；请联系管理员结合可靠客户编号或证明核对。查不到也不代表未开户。查询涵盖所有月份。</div><div id="results"><div class="empty">输入尾号开始查询</div></div></div><div class="panel"><div class="panel-heading"><div><h2>我的奖励标准</h2><p>当月达到新档位，全部有效户按新单价计算</p></div><span class="scope-tag">HKD / 港币</span></div>${tiers()}<p class="subtle">首页预估按所选月份已导入、已核对归属的开户客户数计算，假设这些客户最终全部达标：3 户 HK$1,500，4 户 HK$2,400。自行登记尚未确认开户的客户不计入。有效条件为按约定存入 1 万并满一个月，须另行核实；未达标时按最终有效户数重新确定档位和金额。此预估不是已赚取或可结算金额。</p></div>${admin?`<div class="panel"><h2>伙伴奖励明细</h2><button class="btn primary" id="settlement">生成本月结算草稿</button><p class="subtle">草稿保留生成时的金额与客户清单，不代表已付款。后续数据变化须重新生成并核对。</p><p class="subtle">每位伙伴独立达到阶梯后再合计；未归属客户 ${overview.unassigned} 条。</p><div class="tablewrap"><table class="data"><tr><th>伙伴</th><th>开户户数</th><th>开户奖励预估</th><th>已确认有效户</th><th>有效户单价</th><th>已审核奖励参考</th></tr>${overview.partners.map(p=>`<tr><td>${esc(p.label)}</td><td>${p.total}</td><td>${hk(openingForecast(p.total))}</td><td>${p.verified}</td><td>${hk(p.rate)}</td><td>${hk(p.reward)}</td></tr>`).join('')}</table></div><h3>结算草稿记录</h3>${overview.settlements.length?overview.settlements.map(x=>`<details><summary>#${x.id} · ${esc(x.at)} · ${hk(x.snapshot.total)} · 待核对</summary>${x.snapshot.partners.map(p=>`<p>${esc(p.label)}：${p.verified} 户 × ${hk(p.rate)} = ${hk(p.reward)}</p>`).join('')}</details>`).join(''):'暂无草稿'}</div>`:''}`;$('#month').onchange=async e=>{if(e.target.value){month=e.target.value;try{await load()}catch(err){notify(err.message)}}};$('#settlement')?.addEventListener('click',async()=>{try{await post('/api/settlement',{month});await load();notify('结算草稿已保存，未执行付款')}catch(e){notify(e.message)}});$('#searchform').onsubmit=async e=>{e.preventDefault();await fetchRows($('#query').value,'#results',$('#query-type').value)}}

async function registrationsPage(){
 const admin=me.role==='admin';$('#view').innerHTML=`<h1>${admin?'客户登记与归属核对':'我的客户登记'}</h1><div class="panel"><p class="note">登记仅记录推荐来源，不代表官方已注册、已开户或已达标。尾号不能证明身份；请通过已获授权的客户编号与记录核对。待核对登记不计入奖励。</p><form id="registration-form" class="filters"><input class="field" name="tail" aria-label="手机尾号" placeholder="手机后四位" pattern="[0-9]{4}" maxlength="4" required><input class="field" name="code" aria-label="客户编号" placeholder="致富客户编号（可稍后核对）" pattern="[A-Za-z0-9_-]{1,64}" maxlength="64"><button class="btn primary">登记客户</button></form><p class="subtle">自动记在当前账号名下；请勿填写完整手机号。编号不是邀请码。列表显示最近 300 条登记。</p></div><div class="panel" id="registrations-list">加载中…</div>`;
 $('#registration-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await post('/api/register-client',{last4:f.elements.tail.value,client_code:f.elements.code.value});await registrationsPage();notify('登记已保存，等待核对；尚未计入奖励')}catch(err){notify(err.message);b.disabled=false}};
 try{const d=await api('/api/registrations'),el=$('#registrations-list');if(!el)return;el.innerHTML=d.rows.length?`<div class="tablewrap"><table class="data"><tr><th>登记时间</th>${admin?'<th>提交人</th>':''}<th>尾号</th><th>提交的编号（待核实）</th><th>归属审核</th><th>官方进度</th><th>审核更新时间</th>${admin?'<th>操作</th>':''}</tr>${d.rows.map((r,i)=>`<tr><td>${esc(r.created)}</td>${admin?`<td>${esc(r.label)}</td>`:''}<td>****${esc(r.last4)}</td><td>${esc(r.claimed_code||'未提供')}</td><td>${esc(r.status)}</td><td>${esc(r.official_status)}</td><td>${esc(r.reviewed_at||'—')}</td>${admin?`<td>${['待核对','官方已注册'].includes(r.status)?`<button class="btn sm" data-review="${i}" data-action="link">核对并关联</button> <button class="btn sm" data-review="${i}" data-action="registered">确认官方注册</button> <button class="btn sm" data-review="${i}" data-action="reject">不通过</button>`:'已处理'}</td>`:''}</tr>`).join('')}</table></div>`:'暂无登记。客户尚未进入官方报表时，可先在上方登记。';
 el.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const r=d.rows[Number(b.dataset.review)],decision=b.dataset.action;let code='';if(decision==='link'){code=prompt('请输入已核对的官方客户编号。必须已导入 YE3376 报表；不能仅凭尾号确认。',r.claimed_code);if(!code)return}const evidence=prompt(decision==='registered'?'请输入官方注册记录的来源、时间及核对依据（不得仅依据朋友口述）：':'请输入归属核对依据或不通过原因（5–500字）：');if(evidence===null)return;b.disabled=true;try{await post('/api/review-registration',{id:r.id,decision,client_code:code,evidence});await registrationsPage();notify('审核已保存。有效资格仍需另行核实。')}catch(err){notify(err.message);b.disabled=false}});
 }catch(err){notify(err.message)}
}

function clientsPage(){$('#view').innerHTML=`<h1>客户归属与审核</h1><div class="panel"><div class="note">用可靠客户编号与授权的证明材料核对后分配。不能单凭尾号认领；新导入客户默认未分配、未审核。取消归属选「未分配」，管理员本人客户选「管理员本人」。</div><form class="lookup" id="filterform"><input aria-label="尾号筛选" id="filter" maxlength="4" pattern="[0-9]{4}" placeholder="尾号筛选，留空显示最近 300 条"><button class="btn">刷新列表</button></form><div id="results"></div></div>`;$('#filterform').onsubmit=e=>{e.preventDefault();fetchRows($('#filter').value,'#results')};fetchRows('','#results')}
async function fetchRows(query,target,type='tail'){const el=$(target);el.innerHTML='<div class="empty">查询中…</div>';try{let d=await api('/api/clients'+(query?'?type='+encodeURIComponent(type)+'&q='+encodeURIComponent(query):''));if(!el.isConnected)return;renderRows(d.rows,el)}catch(e){if(el.isConnected)el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderRows(rows,el){const admin=me.role==='admin';if(!rows.length){el.innerHTML='<div class="empty">当前权限范围内没有匹配记录</div>';return}el.innerHTML=`<p class="subtle">显示 ${rows.length} 条记录${rows.length>1?'；请注意同尾号记录不能相互替代':''}。</p><div class="tablewrap"><table class="data"><thead><tr>${admin?'<th>客户编号</th>':''}<th>手机尾号</th><th>开户状态</th><th>开户日期</th><th>审核状态</th>${admin?'<th>归属</th><th>有效审核</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${admin?`<td>${esc(r.client_code)}</td>`:''}<td>**** ${esc(r.last4||'未知')}</td><td>${esc(r.opening_status)}</td><td>${esc(r.open_date||'—')}</td><td><span class="tag ${r.verified?'soft':'warn'}">${r.verified?'已确认有效':'待审核'}</span></td>${admin?`<td><select aria-label="客户归属" class="field" data-owner="${i}"><option value="" ${r.owner_id==null?'selected':''}>未分配</option>${[{id:me.id,label:'管理员本人'},...partners].map(p=>`<option value="${p.id}" ${p.id===r.owner_id?'selected':''}>${esc(p.label)}</option>`).join('')}</select></td><td><button class="btn sm" data-verify="${i}">${r.verified?'撤销有效':'确认有效'}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;el.querySelectorAll('[data-owner]').forEach(x=>x.onchange=async()=>{const r=rows[Number(x.dataset.owner)],old=r.owner_id,note=prompt('请输入归属核对依据（5–500字），例如：已按客户编号核对授权登记记录。请勿填写完整手机号。',r.note||'');if(note===null){x.value=old??'';return}x.disabled=true;try{await post('/api/assign',{client_code:r.client_code,owner_id:x.value?Number(x.value):null,note});r.owner_id=x.value?Number(x.value):null;r.note=note;notify('归属已更新并留存记录')}catch(e){x.value=old??'';notify(e.message)}finally{x.disabled=false}});el.querySelectorAll('[data-verify]').forEach(x=>x.onclick=async()=>{const r=rows[Number(x.dataset.verify)];if(!confirm(r.verified?'撤销该客户的有效资格？奖励会重新计算。':'已核对正式有效户标准，确认该客户有效？'))return;x.disabled=true;try{await post('/api/verify',{client_code:r.client_code,verified:!r.verified});r.verified=!r.verified;renderRows(rows,el);notify('审核已更新，奖励按最新状态计算')}catch(e){notify(e.message);x.disabled=false}})}
function importPage(){$('#view').innerHTML=`<h1>Excel 导入</h1><div class="panel"><h2>更新客户报表</h2><p class="desc">仅导入 ReferralCode = YE3376 的记录，按 ClientCode 去重。</p><p class="note">仅支持原始 .xlsx 报表。重复导入保留原有归属和人工审核结果；如报表出现资格变动，请重新复核。请先确认获准使用客户数据。</p><form id="uploadform"><input aria-label="Excel 文件" id="file" type="file" accept=".xlsx" required><button class="btn primary" style="margin:20px" id="upload">导入报表</button></form><div id="uploadresult" role="status"></div></div><div class="panel"><h2>最近导入</h2>${overview.imports.length?overview.imports.map(x=>`<p>${esc(x.at)} · ${esc(x.filename)} · 新增 ${x.inserted} / 更新 ${x.updated}</p>`).join(''):'暂无导入记录'}</div>`;$('#uploadform').onsubmit=async e=>{e.preventDefault();const f=$('#file').files[0],b=$('#upload');if(f.size>24*1024*1024)return notify('文件不能超过 24 MB');b.disabled=true;try{const d=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:await f.arrayBuffer()});await load();$('#uploadresult').textContent=`导入成功：匹配 ${d.filtered}，新增 ${d.inserted}，更新 ${d.updated}。`}catch(err){notify(err.message);b.disabled=false}}}
function securityPage(){
$('#view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>修改我的密码</h1><div class="desc">仅修改当前登录账号。密码更新后需要重新登录。</div></div></div><div class="panel" style="max-width:650px"><form id="my-password-form" class="security-form"><label>当前密码<input class="field" name="old" type="password" autocomplete="current-password" required></label><label>新密码<input class="field" name="new" type="password" minlength="12" maxlength="128" autocomplete="new-password" required placeholder="至少 12 位"></label><label>确认新密码<input class="field" name="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="btn primary" type="submit">保存新密码</button><p class="subtle">建议使用不同于其他网站的长密码。不要将密码通过微信群发送。</p></form></div>`;
$('#my-password-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;try{await post('/api/change-own-password',{old_password:form.elements.old.value,new_password:form.elements.new.value,confirm_password:form.elements.confirm.value});me=null;csrf='';loginView();notify('密码修改成功，请使用新密码重新登录')}catch(err){notify(err.message);button.disabled=false}};
}

function accountsPage(){$('#view').innerHTML=`<h1>账号管理</h1><div class="panel"><h2>重设登录密码</h2><p class="subtle">至少 12 位。修改后该账号已有登录立即失效。请分别告知对应朋友。</p><form id="passwordform" class="filters"><select aria-label="选择账号" class="field" id="account">${[{username:me.username,label:'管理员'},...partners].map(p=>`<option value="${esc(p.username)}">${esc(p.label)} · ${esc(p.username)}</option>`).join('')}</select><input aria-label="新密码" class="field" id="newpassword" type="password" minlength="12" autocomplete="new-password" required placeholder="新密码（至少 12 位）"><button class="btn primary">更新密码</button></form></div>`;$('#passwordform').onsubmit=async e=>{e.preventDefault();try{const username=$('#account').value;await post('/api/change-password',{username,password:$('#newpassword').value});if(username===me.username){me=null;loginView();notify('密码已修改，请重新登录')}else{$('#newpassword').value='';notify('密码已修改，旧登录已失效')}}catch(err){notify(err.message)}}}
boot();

</script></body></html>
